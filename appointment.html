<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an appointment</title>
</head>
<body>
    <h1>Book an appointment</h1>
    <p>Please fill out the form below to book an appointment.</p>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required placeholder="Enter name..."><br><br>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" required placeholder="Enter phone number..."><br><br>
        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="Enter email..."><br><br>


        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required><br><br>

        <label for="time">Time:</label>
        <input type="time" id="time" name="time" required><br><br>
        <label for="Department">Select Doctor:</label>
        <select id="Department" name="Department" required>
            <option value="">Select Doctor</option>
            <option value="dr-sakala">Dr. Moses Sakala - General Practitioner</option>
            <option value="dr-margaret">Dr. Margaret Sakala - Pediatrician</option>
            <option value="dr-taonga">Dr. Taonga Sakala - Dermatologist</option>
        </select><br><br>
        <label for="Medical concern">Medical Concern:</label>
        <textarea id="Medical concern" name="Medical concern" required placeholder="Describe your medical concern..."></textarea><br><br>

        <input type="submit" value="Book Appointment">
</body>
</html>
